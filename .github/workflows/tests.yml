name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python-version: "3.9", os: ubuntu-22.04 }    # oldest supported; not on the newest runner image
          - { python-version: "3.12", os: ubuntu-latest }
          - { python-version: "3.13", os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Regenerate every committed output
        run: scripts/reproduce.sh
      - name: Fail if anything changed
        run: git diff --exit-code
  action:
    # Run the published GitHub Action against this repository, as a user's workflow would.
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./
        with: { github-prs: "true", max-prs: "50" }
      - name: Report was written
        run: test -s absorption-report.md && head -5 absorption-report.md
